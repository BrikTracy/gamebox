name: build-image
on:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: "0 4 * * 1" }]   # co poniedziałek: świeża baza Bazzite
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gamebox,        base: ghcr.io/ublue-os/bazzite }
          - { name: gamebox-nvidia, base: ghcr.io/ublue-os/bazzite-nvidia }
    steps:
      - uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with: { tool-cache: true }
      - uses: actions/checkout@v4
      - id: o
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          build-args: BASE_IMAGE=${{ matrix.base }}
          tags: ghcr.io/${{ steps.o.outputs.owner }}/${{ matrix.name }}:latest
