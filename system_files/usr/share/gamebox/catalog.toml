# GameBox: katalog emulatorów i aplikacji.
#
# To JEDYNE miejsce, gdzie wymieniamy programy. Z tego pliku korzystają:
#   - ISO            (tier = "bundled" -> wbudowane w płytę, instalacja bez internetu)
#   - Bazaar         (sekcja "Emulacja" w sklepie Bazzite, build_files/patch-bazaar.py)
#   - gamebox-emu    (instalacja / usuwanie / doctor / okno wyboru)
#   - firstboot      (dobranie do sprzętu: usuwa to, co na tym CPU nie ruszy)
#
# Identyfikatory (id) pochodzą z listy polecanej przez Bazzite w Bazaarze albo zostały
# sprawdzone na Flathubie (DuckStation, Flycast, antimicrox). `gamebox-emu doctor --online`
# sprawdza je ponownie na żywo.
#
# Pola:
#   tier      bundled = w ISO (usuwane przy pierwszym starcie, jeśli sprzęt jej nie uciągnie)
#             store   = tylko na żądanie (Bazaar / gamebox-emu install)
#   avx2      true = wymaga CPU z AVX2 (PCSX2: oficjalne minimum; RPCS3/Cemu: poniżej zaleca się AVX2)
#   min_class najsłabsza klasa sprzętu (LOW < MID < HIGH, liczy gamebox-hwdetect), na której ma sens
#   lxb       jak widzi to LineXinBar:
#               library  = biblioteka gier z okładkami (tylko RetroArch przez lxb-retroarch)
#               launcher = wiersz w kolumnie Games (każdy Flatpak z kategorią Game)
#               tool     = narzędzie (kolumna Utilities/Software)

[[app]]
id = "org.libretro.RetroArch"
name = "RetroArch"
desc = "Jeden program na ponad 40 konsol. Najlepszy wybór na stare laptopy."
